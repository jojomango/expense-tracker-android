appId: com.jojomango.expensetracker
---
# TESTCASES.md E2E-1 首次使用
# Given 使用者第一次開啟 app（無任何資料）
# When  畫面載入
# Then  顯示引導畫面，要求建立第一個錢包
# 不直接用 `launchApp: { clearState: true }`——clearState 拆掉舊 task 後會排一個
# 約 1.15 秒的 destroy timeout，在那之內重新啟動的話，新 process 會被 AMS 誤殺，
# App 一啟動就死掉（CI 上實際踩到 4 次）。詳見 scripts/settle-after-clear.js 檔頭。
- clearState
- runScript: scripts/settle-after-clear.js
- launchApp:
    stopApp: false
- assertVisible: "建立你的第一個錢包"

# When 輸入名稱「日常」、幣別「TWD」、預算模式「每週」、金額「3000」
- tapOn: "錢包名稱"
- inputText: "日常"
- tapOn: "幣別（ISO 4217，如 TWD）"
- eraseText: 10
- inputText: "TWD"
- tapOn: "每週"
- tapOn: "預算金額"
- inputText: "3000"
# 收起系統鍵盤——這個表單是真正的系統 TextField（不是記帳頁的自製鍵台），
# 鍵盤開著會蓋住畫面下方的「建立錢包」按鈕，導致 Maestro 找不到這個元素。
- hideKeyboard
# And 送出
- tapOn: "建立錢包"

# Then 進入主畫面
# And 顯示錢包「日常」
# And 顯示本週餘額「NT$3,000.00」
- assertVisible: "日常"
- assertVisible: "NT$3,000.00"

# And 分類清單已預先填入 7 個支出分類與 4 個收入分類
# （domain/Category.kt DefaultCategories.seedDefaults() — T2.2.x 已用單元測試覆蓋
# 種子內容本身；這裡只需要確認記帳頁的分類網格真的把種子資料渲染出來）
# 分類網格是 CategoryDao.observeAll() 的 `ORDER BY isDefault DESC, name ASC`
# 結果（依名稱字母序，不是 seedDefaults() 的插入順序），「飲食」按這個排序會
# 排到最後一個、掉到第二列被畫面裁掉。scrollUntilVisible 對這個畫面沒用——
# 它挑的預設觸控點落在下方的自製數字鍵台（也是 LazyVerticalGrid，但內容剛好
# 塞得下、滑不動），滑不到分類網格本身。改用明確座標的 swipe，只在分類網格
# 的可視範圍內（螢幕高度 23%~38% 之間）拖曳，才能真的滑到這個 grid。
- tapOn: "記帳"
- assertVisible: "居住"
- assertVisible: "其他"
- swipe:
    direction: UP
    from:
      text: "交通"
- assertVisible: "飲食"
- tapOn: "收入"
- assertVisible: "薪資"
- assertVisible: "獎金"
- assertVisible: "投資"
- tapOn: "取消"
