appId: com.jojomango.expensetracker
---
# TESTCASES.md E2E-2 記一筆帳
# Given 已有錢包「日常」（TWD，週預算 3000）且本週無交易
# ——用 E2E-1 同樣的引導流程建立前提條件，這個 flow 本身不驗證 E2E-1 的內容。
# 不直接用 `launchApp: { clearState: true }`——clearState 拆掉舊 task 後會排一個
# 約 1.15 秒的 destroy timeout，在那之內重新啟動的話，新 process 會被 AMS 誤殺，
# App 一啟動就死掉（CI 上實際踩到 4 次）。詳見 scripts/settle-after-clear.js 檔頭。
- clearState
- runScript: scripts/settle-after-clear.js
- launchApp:
    stopApp: false
# launchApp 本身不保證第一幀畫完就回傳——E2E-1 因為緊接著有 assertVisible
# （會重試等待），冷啟動的等待時間剛好夠；這支少了這一步，直接 tapOn 會在
# 畫面還是全白的時候就撲空。補上同樣的 assertVisible 當作啟動完成的等待點。
- assertVisible: "建立你的第一個錢包"
- tapOn: "錢包名稱"
- inputText: "日常"
- tapOn: "幣別（ISO 4217，如 TWD）"
- eraseText: 10
- inputText: "TWD"
- tapOn: "每週"
- tapOn: "預算金額"
- inputText: "3000"
# 收起系統鍵盤——這個表單是真正的系統 TextField，鍵盤開著會蓋住「建立錢包」按鈕。
- hideKeyboard
- tapOn: "建立錢包"
- assertVisible: "NT$3,000.00"

# When 點擊新增按鈕
- tapOn: "記帳"
# And 輸入金額「120」、選擇分類「飲食」、日期保持預設（今天）
- tapOn: "1"
- tapOn: "2"
- tapOn: "0"
# 分類網格是 CategoryDao.observeAll() 的 `ORDER BY isDefault DESC, name ASC`
# 結果（依名稱字母序），「飲食」排到最後、掉到第二列被畫面裁掉。
# scrollUntilVisible 對這個畫面沒用（它挑的觸控點落在下方滑不動的自製數字
# 鍵台），改用錨定在既有元素（「交通」）上的 swipe，跟畫面解析度無關。
- swipe:
    direction: UP
    from:
      text: "交通"
# 上一次在本機跑，緊接著 tapOn "飲食" 真的點下去了，但送出後交易變成「未分類」——
# LazyVerticalGrid 的 fling 動畫還沒完全停下來就被 tapOn 打斷，觸控座標在動畫
# 還在滾動時被判定成別的位置。等動畫真的停下來再點。
- waitForAnimationToEnd
- tapOn: "飲食"
- assertVisible: "今天"
# And 送出
- tapOn: "記一筆"

# Then 交易出現在列表最上方，顯示「NT$120.00」與「🍜 飲食」
# （TransactionRow 實際渲染會加上收支正負號前綴，支出是 "-NT$120.00"）
- assertVisible: "-NT\\$120.00"
- assertVisible: "飲食"
# And 本週餘額立即變為「NT$2,880.00」（無需重新整理）
- assertVisible: "NT$2,880.00"

# When 將該筆金額編輯為「200」
- tapOn: "飲食"
- tapOn: "⌫"
- tapOn: "⌫"
- tapOn: "⌫"
- tapOn: "2"
- tapOn: "0"
- tapOn: "0"
- tapOn: "儲存"
# Then 本週餘額立即變為「NT$2,800.00」
- assertVisible: "NT$2,800.00"

# When 刪除該筆交易
# `direction: LEFT` + `from: 飲食` 錨定 swipe 的預設拖曳距離不夠長，
# 沒辦法越過 SwipeToDismissBox 的刪除門檻；改用明確座標橫跨整列寬度。
# 這個 Y 座標是「交易列表第一列」在目前畫面（週預算模式的完整預算卡，含
# 已用/還有N天/日均可用三行）底下的實際位置，寫死的百分比——Phase 5 把
# 預算卡加高之後，這裡就要跟著重新校準過一次。這是已知的脆弱點，見
# TASKS.md「已知技術債」：更耐用的做法應該是給交易列的可滑動容器一個
# 穩定的 testTag，用 tag 而不是座標百分比來定位，之後有空可以做。
- swipe:
    start: 88%,48%
    end: 9%,48%
# Then 交易從列表消失
# And 本週餘額立即回到「NT$3,000.00」
- assertNotVisible: "-NT\\$200.00"
- assertVisible: "NT$3,000.00"
