name: E2E

# 故意跟 ci.yml 分開檔案，只掛 push:main 跟 workflow_dispatch，不掛 pull_request——
# emulator + Maestro 這個 job 本來就設計成「不在每個 PR 上跑」（開機成本比 verify
# 貴很多），拆成獨立檔案的目的是讓它連在 PR 的 checks 清單裡都不出現（也就不會有
# 一個永遠顯示 Skipped、容易讓人誤會的項目）。想在 PR 上手動跑一次的話，用
# workflow_dispatch 手動觸發即可。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Maestro on emulator)
    # 原本用 macos-14，但 macos-14 runner 是 Apple Silicon（arm64），設定裡
    # 卻寫死 arch: x86_64，導致 emulator 拿不到硬體加速、每次都 boot timeout
    # （見 TASKS.md「已知技術債」）。改用 ubuntu-latest + KVM 是
    # reactivecircus/android-emulator-runner 官方文件建議的做法：比 macOS
    # runner 快 2-3 倍、也便宜很多，不需要煩惱 host 是什麼 CPU 架構。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator + Maestro flows
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            $ANDROID_HOME/platform-tools/adb install -r app/build/outputs/apk/debug/app-debug.apk
            $HOME/.maestro/bin/maestro test .maestro/

      # Maestro 預設會把每個失敗步驟的螢幕截圖、hierarchy 存到 ~/.maestro/tests/，
      # 但 emulator-runner 這個 step 結束後 emulator 就關了、CI log 只看得到文字
      # 訊息（例如「Element not found」），看不到當下畫面長怎樣——不上傳這個目錄
      # 的話，每次失敗都只能憑程式碼猜，猜錯了又要重跑一次 CI 才知道。
      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests
          if-no-files-found: ignore

      - name: Fail job if Maestro flows failed
        if: steps.maestro.outcome == 'failure'
        run: exit 1
